name: ProjectAgentCompanion
options:
  bundleIdPrefix: dev.ainative
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ''
targets:
  ProjectAgentCompanion:
    type: application
    platform: iOS
    sources:
      - path: ProjectAgentCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ainative.projectagent.companion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ProjectAgentCompanion-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Fuddy
        INFOPLIST_KEY_NSCameraUsageDescription: 扫描 Mac 上的一次性 Companion 配对二维码。
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ProjectAgentCompanion/ProjectAgentCompanion.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
    scheme:
      testTargets:
        - ProjectAgentCompanionTests
  ProjectAgentCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProjectAgentCompanionTests
    dependencies:
      - target: ProjectAgentCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ainative.projectagent.companion.tests
        GENERATE_INFOPLIST_FILE: YES
