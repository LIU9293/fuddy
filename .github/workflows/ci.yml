name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/relay/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix cloud/relay ci
      - run: npm run relay:typecheck
      - run: npm run relay:test

  account-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/account-api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix cloud/account-api ci
      - run: npm run account:typecheck
      - run: npm run account:test
      - run: npm run account:deploy:production:dry-run

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: brew install xcodegen
      - run: npm run prepare:whisper
      - run: cd ios && xcodegen generate
      - run: npm run ios:typecheck
      - name: Run iOS Simulator tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | ruby -rjson -e 'data=JSON.parse(STDIN.read); puts data["devices"].values.flatten.find { |d| d["name"].start_with?("iPhone") }&.fetch("udid", "")')
          test -n "$DEVICE_ID"
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcodebuild \
            -project ios/ProjectAgentCompanion.xcodeproj \
            -scheme ProjectAgentCompanion \
            -destination "id=$DEVICE_ID" \
            test

  package-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:smoke
      - name: Verify packaged application
        run: |
          APP_PATH=$(find dist/dev-smoke -maxdepth 3 -name 'Fuddy Dev.app' -print -quit)
          test -n "$APP_PATH"
          test -f "$APP_PATH/Contents/Resources/app.asar"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")" = 'dev.ainative.projectagent.dev'
